services:
  pos:
    build:
      context: .
      args:
        SERVICE: pos
    ports:
      - "8080:8080"
    environment:
      POS_ADDR: ":8080"
      MERCHANT_ID: "000000000012345"
      TERMINAL_ID: "TERM0001"
      MERCHANT_NAME: "Simple Coffee Co"
      MERCHANT_CITY: "San Francisco"
      MERCHANT_COUNTRY: "US"
      MERCHANT_TZ: "America/Los_Angeles"
      MCC: "5814"
      ACQUIRER_URL: "http://acquirer:8081"
      # Opened by your browser, not the container
      POS_PUBLIC_URL: "http://localhost:8080"
      ACQUIRER_PUBLIC_URL: "http://localhost:8081"
      NETWORK_DASHBOARD_URL: "http://localhost:8090"
      ISSUER_PUBLIC_URL: "http://localhost:8091"
      SETTLEMENT_PUBLIC_URL: "http://localhost:8090/settlement/"
    depends_on:
      - acquirer

  acquirer:
    build:
      context: .
      args:
        SERVICE: acquirer
    ports:
      - "8081:8081"
    environment:
      ACQUIRER_ADDR: ":8081"
      ACQUIRER_ID: "100001"
      ACQUIRER_NAME: "Simple Merchant Bank"
      MERCHANT_DISCOUNT_BPS: "250"
      # The merchant the POS is set up for, signed up with this acquirer
      MERCHANT_ID: "000000000012345"
      TERMINAL_ID: "TERM0001"
      MERCHANT_NAME: "Simple Coffee Co"
      MERCHANT_CITY: "San Francisco"
      MERCHANT_COUNTRY: "US"
      MCC: "5814"
      NETWORK_URL: "http://network:8090"
      POS_PUBLIC_URL: "http://localhost:8080"
      ACQUIRER_PUBLIC_URL: "http://localhost:8081"
      NETWORK_DASHBOARD_URL: "http://localhost:8090"
      ISSUER_PUBLIC_URL: "http://localhost:8091"
      SETTLEMENT_PUBLIC_URL: "http://localhost:8090/settlement/"
    depends_on:
      - network

  network:
    build:
      context: .
      args:
        SERVICE: network
    ports:
      - "8090:8090"
    environment:
      NETWORK_ADDR: ":8090"
      ACQUIRER_ID: "100001"
      ACQUIRER_URL: "http://acquirer:8081" # Asked for its clearing file at the simulated end of day
      ISSUER_FSB_URL: "http://issuer:8091"
      ISSUER_UCB_URL: "http://issuer:8092"
      POS_PUBLIC_URL: "http://localhost:8080"
      ACQUIRER_PUBLIC_URL: "http://localhost:8081"
      NETWORK_DASHBOARD_URL: "http://localhost:8090"
      ISSUER_PUBLIC_URL: "http://localhost:8091"
      SETTLEMENT_PUBLIC_URL: "http://localhost:8090/settlement/"
    depends_on:
      - issuer

  issuer:
    build:
      context: .
      args:
        SERVICE: issuer
    ports:
      - "8091:8091"
      - "8092:8092"
    environment:
      ISSUER_FSB_ADDR: ":8091"
      ISSUER_UCB_ADDR: ":8092"
      # Opened by your browser, not other containers
      ISSUER_FSB_PUBLIC_URL: "http://localhost:8091"
      ISSUER_UCB_PUBLIC_URL: "http://localhost:8092"
      POS_PUBLIC_URL: "http://localhost:8080"
      ACQUIRER_PUBLIC_URL: "http://localhost:8081"
      NETWORK_DASHBOARD_URL: "http://localhost:8090"
      ISSUER_PUBLIC_URL: "http://localhost:8091"
      SETTLEMENT_PUBLIC_URL: "http://localhost:8090/settlement/"
